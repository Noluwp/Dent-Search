<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка профиля</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <!-- Для устройств Apple (iPhone/iPad при сохранении на рабочий стол) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- Для Android и PWA приложений (через manifest.json) -->
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row g-3">
            
            <!-- 1. Зеленая карточка -->
            <div class="col-12 col-md-4">
                <div class="rounded p-3 bg-success text-white">
                    <h3>
                        <i class="fa fa-check-circle fa-fw me-2"></i> Заказ успешно оплачен
                    </h3>
                </div>
            </div>

            <!-- 2. Желтая карточка -->
            <div class="col-12 col-md-4">
                <div class="rounded p-3 bg-warning text-dark">
                    <h3>
                        <i class="fa fa-exclamation-triangle fa-fw me-2"></i> Заполните профиль
                    </h3>
                </div>
            </div>

            <!-- 3. Красная карточка -->
            <div class="col-12 col-md-4">
                <div class="rounded p-3 bg-danger text-white">
                    <h3>
                        <i class="fa fa-times-circle fa-fw me-2"></i> Ошибка соединения
                    </h3>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
